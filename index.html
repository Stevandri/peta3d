<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ================== PENGATURAN ==================
const FILE_MODEL      = 'peta.glb';
const NAMA_SATELIT    = ['SATELIT_1', 'SATELIT_2']; // sesuaikan dengan nama objek di Blender
const AYUN_DERAJAT    = 20;    // berayun kiri-kanan ±20° (bukan putaran penuh)
const AYUN_KECEPATAN  = 1.0;   // makin besar makin cepat
const APUNG_TINGGI    = 0.02;  // tinggi naik-turun (relatif ukuran model)
const APUNG_KECEPATAN = 1.6;
const WARNA_LATAR     = 0xffffff;
const OPACITY_SHADOW  = 0.25;  // 0.15 (tipis) sampai 0.4 (pekat)
// =================================================

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(WARNA_LATAR);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Lampu utama (penghasil shadow)
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

// Tanah putih yang hanya menampilkan bayangan
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.ShadowMaterial({ opacity: OPACITY_SHADOW })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Kamera dan kontrol
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = false; // peta tidak berputar sendiri

// Loader (mendukung file .glb dengan kompresi Draco)
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const satelit = [];

loader.load(
  FILE_MODEL,
  (gltf) => {
    scene.add(gltf.scene);

    // Ukuran model
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // Semua objek menghasilkan dan menerima shadow
    gltf.scene.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });

    // Posisi dan jangkauan lampu menyesuaikan ukuran model
    sun.position.set(center.x + maxDim * 0.6, center.y + maxDim * 1.2, center.z + maxDim * 0.8);
    sun.target.position.copy(center);
    const cam = sun.shadow.camera;
    cam.left = -maxDim; cam.right = maxDim;
    cam.top = maxDim;   cam.bottom = -maxDim;
    cam.near = 0.1;     cam.far = maxDim * 5;
    cam.updateProjectionMatrix();

    // Tanah tepat di bawah model
    ground.scale.set(maxDim * 4, maxDim * 4, 1);
    ground.position.set(center.x, box.min.y - 0.001, center.z);

    // Kamera otomatis sesuai ukuran model
    camera.position.set(center.x, center.y + maxDim * 0.5, center.z + maxDim * 1.3);
    controls.target.copy(center);
    controls.update();

    // Cari satelit berdasarkan nama
    NAMA_SATELIT.forEach((nama, i) => {
      const obj = gltf.scene.getObjectByName(nama);
      if (obj) {
        satelit.push({
          obj,
          y0: obj.position.y,
          rotY0: obj.rotation.y,
          fase: i * 1.5,              // beda fase supaya geraknya tidak kembar
          amp: maxDim * APUNG_TINGGI
        });
      } else {
        console.warn('Objek tidak ditemukan:', nama);
      }
    });

    // Bantuan: tampilkan semua nama objek jika ada nama yang salah
    if (satelit.length < NAMA_SATELIT.length) {
      const daftar = [];
      gltf.scene.traverse((o) => daftar.push(o.name));
      console.log('Nama objek yang ada di model:', daftar);
    }
  },
  undefined,
  (err) => console.error('Gagal memuat model:', err)
);

// Animasi
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  satelit.forEach((s) => {
    s.obj.rotation.y = s.rotY0 + Math.sin(t * AYUN_KECEPATAN + s.fase) * THREE.MathUtils.degToRad(AYUN_DERAJAT);
    s.obj.position.y = s.y0 + Math.sin(t * APUNG_KECEPATAN + s.fase) * s.amp;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Ukuran mengikuti panel
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Penerima data dari panel Grafana (untuk tahap angka dinamis)
addEventListener('message', (e) => {
  if (e.data && e.data.type === 'data') {
    console.log('Data diterima:', e.data.rows);
  }
});
</script>
</body>
</html>
