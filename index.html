<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    model-viewer { width: 100%; height: 100%; }
  </style>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer id="mv"
    src="peta.glb"
    camera-controls
    auto-rotate
    environment-image="neutral"
    shadow-intensity="1"
    exposure="1.1">
  </model-viewer>

  <script>
    // Penerima data dari panel Grafana (dipakai untuk tahap dinamis nanti)
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'data') {
        console.log('Data diterima:', e.data.rows);
      }
    });
  </script>
</body>
</html>
